name: Build AVX512 Universal Dylib

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      out_name:
        description: "Output dylib name"
        required: false
        default: "AVX512"

jobs:
  build:
    runs-on: macos-15

    steps:

      # =========================================================
      # CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # TOOLCHAIN
      # =========================================================

      - name: Show toolchain
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Clang:"
          xcrun --sdk iphoneos -f clang


      # =========================================================
      # LDID
      # =========================================================

      - name: Install ldid
        run: |
          set -euo pipefail

          brew install ldid

          echo "ldid:"
          ldid --version || true


      # =========================================================
      # BUILD UNIVERSAL DYLIB
      # =========================================================

      - name: Build universal dylib
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"

          mkdir -p build_slices
          mkdir -p packages

          echo "========================================"
          echo "AVX512 UNIVERSAL DYLIB BUILD"
          echo "========================================"

          echo "Output: ${OUT_NAME}.dylib"
          echo "SDK: $SDK"
          echo "Clang: $CLANG"


          # =====================================================
          # LOCATE SOURCES
          # =====================================================

          SOURCES=()

          while IFS= read -r SOURCE; do
            [ -n "$SOURCE" ] || continue
            SOURCES+=("$SOURCE")
          done < <(
            find . \
              \( \
                -name '*.m' \
                -o -name '*.mm' \
                -o -name '*.c' \
                -o -name '*.cc' \
                -o -name '*.cpp' \
              \) \
              -not -path './.git/*' \
              -not -path './__MACOSX/*' \
              -not -path './packages/*' \
              -not -path './build_slices/*' \
              | sort
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "::error::No Objective-C/C source files found."
            exit 1
          fi

          echo
          echo "Sources:"
          for SOURCE in "${SOURCES[@]}"; do
            echo "  $SOURCE"
          done


          # =====================================================
          # COMMON FLAGS
          # =====================================================

          COMMON_FLAGS=(

            -isysroot
            "$SDK"

            -miphoneos-version-min=14.0

            -dynamiclib
            -fobjc-arc

            # Capstone
            -DCAPSTONE_HAS_ARM
            -DCAPSTONE_HAS_ARM64
            -DCAPSTONE_HAS_AARCH64
            -DCAPSTONE_USE_SYS_DYN_MEM

            # Includes
            -I.
            -I./x
            -I./x/capstone
            -I./x/capstone/include
            -I./x/mrzefv

            # Frameworks
            -framework Foundation
            -framework UIKit
            -framework QuickLook
            -framework CoreGraphics
            -framework ImageIO
            -framework UserNotifications
            -framework SafariServices
            -framework SceneKit
            -framework WebKit
            -framework QuartzCore
            -framework Photos
            -framework Security
            -framework AVFoundation
            -framework CoreMedia
            -framework LocalAuthentication
            -framework CFNetwork

            # Libraries
            -lz
            -lsqlite3
            -lc++
            -lc++abi

            # Mach-O
            -Wl,-segalign,4000

            # Install name
            -install_name
            "@rpath/${OUT_NAME}.dylib"

            # Keep CI output readable
            -w
          )


          # =====================================================
          # ARM64
          # =====================================================

          echo
          echo "========================================"
          echo "BUILDING ARM64"
          echo "========================================"

          "$CLANG" \
            -arch arm64 \
            "${COMMON_FLAGS[@]}" \
            -o "build_slices/${OUT_NAME}-arm64.dylib" \
            "${SOURCES[@]}"


          echo
          echo "ARM64 succeeded."


          # =====================================================
          # ARM64E
          # =====================================================

          echo
          echo "========================================"
          echo "BUILDING ARM64E"
          echo "========================================"

          "$CLANG" \
            -arch arm64e \
            "${COMMON_FLAGS[@]}" \
            -o "build_slices/${OUT_NAME}-arm64e.dylib" \
            "${SOURCES[@]}"


          echo
          echo "ARM64E succeeded."


          # =====================================================
          # CREATE UNIVERSAL
          # =====================================================

          echo
          echo "========================================"
          echo "CREATING UNIVERSAL DYLIB"
          echo "========================================"

          lipo \
            -create \
            "build_slices/${OUT_NAME}-arm64.dylib" \
            "build_slices/${OUT_NAME}-arm64e.dylib" \
            -output \
            "packages/${OUT_NAME}.dylib"


          # =====================================================
          # SIGN UNIVERSAL
          # =====================================================

          echo
          echo "========================================"
          echo "SIGNING UNIVERSAL DYLIB"
          echo "========================================"

          ldid -S "packages/${OUT_NAME}.dylib"


          # =====================================================
          # VERIFY
          # =====================================================

          echo
          echo "========================================"
          echo "FINAL UNIVERSAL DYLIB"
          echo "========================================"

          file "packages/${OUT_NAME}.dylib"

          echo
          echo "Architectures:"
          lipo -info "packages/${OUT_NAME}.dylib"

          echo
          echo "Linked libraries:"
          otool -L "packages/${OUT_NAME}.dylib" || true

          echo
          echo "Size:"
          ls -lh "packages/${OUT_NAME}.dylib"

          echo
          echo "========================================"
          echo "BUILD COMPLETE"
          echo "========================================"


      # =========================================================
      # UPLOAD ONLY UNIVERSAL DYLIB
      # =========================================================

      - name: Upload universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-universal-${{ github.sha }}
          path: packages/*.dylib
          if-no-files-found: error
          retention-days: 30