name: Build AVX512 Dylib

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      out_name:
        description: "Output dylib name"
        required: false
        default: "AVX512"

      build_source_zip:
        description: "Upload source ZIP"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15

    steps:
      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Xcode / SDK information
      # ---------------------------------------------------------
      - name: Show toolchain
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Clang:"
          xcrun --sdk iphoneos -f clang

      # ---------------------------------------------------------
      # Install ldid
      # ---------------------------------------------------------
      - name: Install ldid
        run: |
          set -euo pipefail

          brew install ldid

          echo
          ldid --version || true

      # ---------------------------------------------------------
      # Locate Objective-C / C / C++ source
      # ---------------------------------------------------------
      - name: Locate source files
        id: source
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Source files:"

          find . \
            \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
            -not -path './.git/*' \
            -not -path './__MACOSX/*' \
            | sort

          COUNT="$(
            find . \
              \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
              -not -path './.git/*' \
              -not -path './__MACOSX/*' \
              | wc -l \
              | tr -d ' '
          )"

          echo
          echo "Found $COUNT source files."

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No source files found."
            exit 1
          fi

          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      # ---------------------------------------------------------
      # Build arm64 + arm64e
      # ---------------------------------------------------------
      - name: Build dylib
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"

          mkdir -p build_slices
          mkdir -p packages

          echo "SDK: $SDK"
          echo "Clang: $CLANG"

          # -----------------------------------------------------
          # Collect sources
          # -----------------------------------------------------

          mapfile -t SOURCES < <(
            find . \
              \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
              -not -path './.git/*' \
              -not -path './__MACOSX/*' \
              | sort
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "::error::No source files found."
            exit 1
          fi

          echo
          echo "Compiling:"
          printf '  %s\n' "${SOURCES[@]}"

          # -----------------------------------------------------
          # Include paths
          # -----------------------------------------------------

          INCLUDE_FLAGS=(
            -I.
            -I./x
            -I./x/capstone
            -I./x/capstone/include
          )

          # -----------------------------------------------------
          # Common compiler flags
          # -----------------------------------------------------

          COMMON_FLAGS=(
            -isysroot "$SDK"
            -miphoneos-version-min=14.0

            -dynamiclib
            -fobjc-arc

            -DCAPSTONE_HAS_ARM
            -DCAPSTONE_HAS_ARM64
            -DCAPSTONE_HAS_AARCH64
            -DCAPSTONE_USE_SYS_DYN_MEM

            "${INCLUDE_FLAGS[@]}"

            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            -framework QuartzCore
            -framework SceneKit
            -framework WebKit
            -framework Security
            -framework AVFoundation
            -framework CoreMedia
            -framework CFNetwork
            -framework LocalAuthentication

            -lz
            -lsqlite3
            -lc++
            -lc++abi

            -Wl,-segalign,4000

            -install_name "@rpath/${OUT_NAME}.dylib"

            -w
          )

          BUILT=()

          # -----------------------------------------------------
          # arm64
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "Building arm64"
          echo "========================================"

          if "$CLANG" \
            -arch arm64 \
            "${COMMON_FLAGS[@]}" \
            -o "build_slices/${OUT_NAME}-arm64.dylib" \
            "${SOURCES[@]}"
          then
            echo "arm64 build succeeded."
            BUILT+=("build_slices/${OUT_NAME}-arm64.dylib")
          else
            echo "::warning::arm64 build failed."
          fi

          # -----------------------------------------------------
          # arm64e
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "Building arm64e"
          echo "========================================"

          if "$CLANG" \
            -arch arm64e \
            "${COMMON_FLAGS[@]}" \
            -o "build_slices/${OUT_NAME}-arm64e.dylib" \
            "${SOURCES[@]}"
          then
            echo "arm64e build succeeded."
            BUILT+=("build_slices/${OUT_NAME}-arm64e.dylib")
          else
            echo "::warning::arm64e build failed."
          fi

          # -----------------------------------------------------
          # Verify something actually built
          # -----------------------------------------------------

          if [ "${#BUILT[@]}" -eq 0 ]; then
            echo "::error::No architectures built successfully."
            exit 1
          fi

          # -----------------------------------------------------
          # Universal dylib
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "Creating universal dylib"
          echo "========================================"

          if [ "${#BUILT[@]}" -eq 1 ]; then
            cp "${BUILT[0]}" "packages/${OUT_NAME}.dylib"
          else
            lipo \
              -create \
              "${BUILT[@]}" \
              -output "packages/${OUT_NAME}.dylib"
          fi

          # -----------------------------------------------------
          # Ad-hoc sign
          # -----------------------------------------------------

          echo
          echo "Signing dylib..."

          ldid -S "packages/${OUT_NAME}.dylib"

          for dylib in build_slices/*.dylib; do
            ldid -S "$dylib" || true
          done

          # -----------------------------------------------------
          # Inspect output
          # -----------------------------------------------------

          echo
          echo "========================================"
          echo "Build results"
          echo "========================================"

          file "packages/${OUT_NAME}.dylib"

          echo
          lipo -info "packages/${OUT_NAME}.dylib" || true

          echo
          ls -lh packages/
          ls -lh build_slices/

      # ---------------------------------------------------------
      # Verify Mach-O architectures
      # ---------------------------------------------------------
      - name: Verify universal dylib
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          DYLIB="packages/${OUT_NAME}.dylib"

          test -f "$DYLIB"

          echo "File:"
          file "$DYLIB"

          echo
          echo "Architectures:"
          lipo -info "$DYLIB"

          echo
          echo "Load commands:"
          otool -L "$DYLIB" || true

      # ---------------------------------------------------------
      # Generate build manifest
      # ---------------------------------------------------------
      - name: Generate build manifest
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          cat > packages/build-info.txt <<EOF
          AVX512 Dylib Build
          ==================

          Name: ${OUT_NAME}.dylib

          Commit:
          ${GITHUB_SHA}

          Branch:
          ${GITHUB_REF_NAME}

          Runner:
          ${RUNNER_OS}

          Xcode:
          $(xcodebuild -version | tr '\n' ' ')

          SDK:
          $(xcrun --sdk iphoneos --show-sdk-path)

          Architectures:
          $(lipo -info "packages/${OUT_NAME}.dylib" 2>&1)

          File:
          $(file "packages/${OUT_NAME}.dylib")
          EOF

          cat packages/build-info.txt

      # ---------------------------------------------------------
      # Upload universal dylib
      # ---------------------------------------------------------
      - name: Upload universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-universal-${{ github.sha }}
          path: packages/*.dylib
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Upload individual architecture slices
      # ---------------------------------------------------------
      - name: Upload architecture slices
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-slices-${{ github.sha }}
          path: build_slices/*.dylib
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Upload build information
      # ---------------------------------------------------------
      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-build-info-${{ github.sha }}
          path: packages/build-info.txt
          if-no-files-found: error
          retention-days: 30

      # ---------------------------------------------------------
      # Package source
      # ---------------------------------------------------------
      - name: Package source
        if: ${{ github.event.inputs.build_source_zip != 'false' }}
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          zip -r \
            "packages/${OUT_NAME}-source.zip" \
            . \
            -x './.git/*' \
            -x './__MACOSX/*' \
            -x './packages/*' \
            -x './build_slices/*'

          ls -lh "packages/${OUT_NAME}-source.zip"

      # ---------------------------------------------------------
      # Upload source
      # ---------------------------------------------------------
      - name: Upload source ZIP
        if: ${{ github.event.inputs.build_source_zip != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-source-${{ github.sha }}
          path: packages/*-source.zip
          if-no-files-found: error
          retention-days: 30