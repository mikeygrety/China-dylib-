name: Build AVX512 Dylib

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      out_name:
        description: 'Output dylib name'
        required: false
        default: 'AVX512'

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: xcodebuild -version

      - name: Install ldid
        run: brew install ldid

      - name: Build dylib
        env:
          OUT: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          CLANG=$(xcrun --sdk iphoneos -f clang)

          mkdir -p packages build_slices

          SOURCES=()

          while IFS= read -r f; do
            SOURCES+=("$f")
          done < <(
            find . \
              \( -name '*.m' -o -name '*.mm' -o -name '*.c' \) \
              -not -path './.git/*' \
              -not -path '*/__MACOSX/*' \
              | sort
          )

          if [ "${#SOURCES[@]}" -eq 0 ]; then
            echo "::error::No Objective-C/C sources found"
            exit 1
          fi

          echo "Compiling ${#SOURCES[@]} source files"

          COMMON_FLAGS=(
            -isysroot "$SDK"
            -miphoneos-version-min=14.0
            -dynamiclib
            -fobjc-arc
            -I.
            -framework UIKit
            -framework Foundation
            -framework CoreGraphics
            -framework UserNotifications
            -framework SafariServices
            -framework SceneKit
            -framework WebKit
            -framework QuartzCore
            -framework ImageIO
            -framework Photos
            -framework QuickLook
            -framework Security
            -framework AVFoundation
            -framework CoreMedia
            -framework LocalAuthentication
            -framework CFNetwork
            -lz
            -lsqlite3
            -lc++
            -lc++abi
            -Wl,-segalign,4000
            -install_name "@rpath/${OUT}.dylib"
            -w
          )

          BUILT=()

          for ARCH in arm64 arm64e; do
            echo "=== Building $ARCH ==="

            if "$CLANG" \
                -arch "$ARCH" \
                "${COMMON_FLAGS[@]}" \
                -o "build_slices/${OUT}-${ARCH}.dylib" \
                "${SOURCES[@]}"; then

              echo "$ARCH OK"
              BUILT+=("build_slices/${OUT}-${ARCH}.dylib")

            else

              echo "::warning::$ARCH failed to link"

            fi
          done

          if [ "${#BUILT[@]}" -eq 0 ]; then
            echo "::error::No architecture linked successfully"
            exit 1
          fi

          if [ "${#BUILT[@]}" -eq 1 ]; then
            cp "${BUILT[0]}" "packages/${OUT}.dylib"
          else
            lipo \
              -create \
              "${BUILT[@]}" \
              -output "packages/${OUT}.dylib"
          fi

          echo "Fakesigning..."
          ldid -S "packages/${OUT}.dylib"

          echo "Built:"
          file "packages/${OUT}.dylib"
          lipo -info "packages/${OUT}.dylib" || true
          ls -lh "packages/${OUT}.dylib"

      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-dylib-${{ github.sha }}
          path: packages/*.dylib
          retention-days: 30

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-source-${{ github.sha }}
          path: |
            AVX512Hook.h
            AVX512Hook.m
            README.md
            build.sh
            .github/workflows/build.yml
          retention-days: 30