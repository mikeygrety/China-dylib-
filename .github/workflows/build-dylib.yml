name: Build AVX512 Dylib

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      out_name:
        description: "Output dylib name"
        required: false
        default: "AVX512"

      build_source_zip:
        description: "Upload source ZIP"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euo pipefail

          xcodebuild -version

          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path

          echo
          echo "Clang:"
          xcrun --sdk iphoneos -f clang

      - name: Install ldid
        run: |
          set -euo pipefail

          brew install ldid
          ldid --version || true

      - name: Locate source files
        run: |
          set -euo pipefail

          echo "Repository:"
          pwd

          echo
          echo "Source files:"

          find . \
            \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
            -not -path './.git/*' \
            -not -path './__MACOSX/*' \
            | sort

          COUNT=$(
            find . \
              \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
              -not -path './.git/*' \
              -not -path './__MACOSX/*' \
              | wc -l
          )

          COUNT=$(echo "$COUNT" | tr -d ' ')

          echo
          echo "Found $COUNT source files."

          if [ "$COUNT" -eq 0 ]; then
            echo "::error::No Objective-C/C source files found."
            exit 1
          fi

      - name: Build dylib
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CLANG="$(xcrun --sdk iphoneos -f clang)"

          mkdir -p build_slices
          mkdir -p packages

          echo "SDK: $SDK"
          echo "Clang: $CLANG"

          # ---------------------------------------------------
          # Build a newline-separated source list.
          #
          # Do NOT use mapfile/readarray because the macOS
          # system Bash does not provide it.
          # ---------------------------------------------------

          SOURCE_LIST="build_sources.txt"

          find . \
            \( -name '*.m' -o -name '*.mm' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' \) \
            -not -path './.git/*' \
            -not -path './__MACOSX/*' \
            -not -path './packages/*' \
            -not -path './build_slices/*' \
            | sort > "$SOURCE_LIST"

          if [ ! -s "$SOURCE_LIST" ]; then
            echo "::error::No source files found."
            exit 1
          fi

          echo
          echo "Compiling:"
          cat "$SOURCE_LIST"

          # ---------------------------------------------------
          # Include paths
          # ---------------------------------------------------

          INCLUDE_FLAGS="
            -I.
            -I./x
            -I./x/capstone
            -I./x/capstone/include
          "

          # ---------------------------------------------------
          # Common compiler flags
          # ---------------------------------------------------

          COMMON_FLAGS="
            -isysroot $SDK
            -miphoneos-version-min=14.0
            -dynamiclib
            -fobjc-arc

            -DCAPSTONE_HAS_ARM
            -DCAPSTONE_HAS_ARM64
            -DCAPSTONE_HAS_AARCH64
            -DCAPSTONE_USE_SYS_DYN_MEM

            $INCLUDE_FLAGS

            -framework Foundation
            -framework UIKit
            -framework CoreGraphics
            -framework QuartzCore
            -framework SceneKit
            -framework WebKit
            -framework Security
            -framework AVFoundation
            -framework CoreMedia
            -framework CFNetwork
            -framework LocalAuthentication

            -lz
            -lsqlite3
            -lc++
            -lc++abi

            -Wl,-segalign,4000

            -install_name @rpath/${OUT_NAME}.dylib

            -w
          "

          # ---------------------------------------------------
          # Convert source list into shell arguments safely.
          #
          # Since the project paths are normal repository paths,
          # this is sufficient for the generated build.
          # ---------------------------------------------------

          SOURCES=""

          while IFS= read -r SOURCE; do
            SOURCES="$SOURCES \"$SOURCE\""
          done < "$SOURCE_LIST"

          BUILT=""

          # ---------------------------------------------------
          # arm64
          # ---------------------------------------------------

          echo
          echo "========================================"
          echo "Building arm64"
          echo "========================================"

          if eval "\"$CLANG\" -arch arm64 $COMMON_FLAGS -o \"build_slices/${OUT_NAME}-arm64.dylib\" $SOURCES"; then
            echo "arm64 build succeeded."
            BUILT="$BUILT build_slices/${OUT_NAME}-arm64.dylib"
          else
            echo "::warning::arm64 build failed."
          fi

          # ---------------------------------------------------
          # arm64e
          # ---------------------------------------------------

          echo
          echo "========================================"
          echo "Building arm64e"
          echo "========================================"

          if eval "\"$CLANG\" -arch arm64e $COMMON_FLAGS -o \"build_slices/${OUT_NAME}-arm64e.dylib\" $SOURCES"; then
            echo "arm64e build succeeded."
            BUILT="$BUILT build_slices/${OUT_NAME}-arm64e.dylib"
          else
            echo "::warning::arm64e build failed."
          fi

          # ---------------------------------------------------
          # Verify build
          # ---------------------------------------------------

          if [ -z "$BUILT" ]; then
            echo "::error::No architecture built successfully."
            exit 1
          fi

          # ---------------------------------------------------
          # Create universal dylib
          # ---------------------------------------------------

          echo
          echo "========================================"
          echo "Creating universal dylib"
          echo "========================================"

          BUILT_COUNT=$(echo "$BUILT" | wc -w | tr -d ' ')

          if [ "$BUILT_COUNT" -eq 1 ]; then
            FIRST=$(echo "$BUILT" | awk '{print $1}')
            cp "$FIRST" "packages/${OUT_NAME}.dylib"
          else
            lipo \
              -create \
              $BUILT \
              -output "packages/${OUT_NAME}.dylib"
          fi

          # ---------------------------------------------------
          # Sign
          # ---------------------------------------------------

          echo
          echo "Signing universal dylib..."

          ldid -S "packages/${OUT_NAME}.dylib"

          for DYLIB in build_slices/*.dylib; do
            [ -f "$DYLIB" ] || continue
            ldid -S "$DYLIB" || true
          done

          # ---------------------------------------------------
          # Inspect
          # ---------------------------------------------------

          echo
          echo "========================================"
          echo "BUILD RESULT"
          echo "========================================"

          file "packages/${OUT_NAME}.dylib"

          echo
          echo "Architectures:"
          lipo -info "packages/${OUT_NAME}.dylib"

          echo
          echo "Linked frameworks:"
          otool -L "packages/${OUT_NAME}.dylib" || true

          echo
          echo "Files:"
          ls -lh packages/
          ls -lh build_slices/

      - name: Verify universal dylib
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          DYLIB="packages/${OUT_NAME}.dylib"

          if [ ! -f "$DYLIB" ]; then
            echo "::error::Universal dylib was not created."
            exit 1
          fi

          echo "Checking $DYLIB"

          file "$DYLIB"

          echo
          lipo -info "$DYLIB"

          echo
          echo "Mach-O header:"
          otool -hv "$DYLIB" || true

      - name: Generate build info
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          {
            echo "AVX512 Dylib Build"
            echo "=================="
            echo
            echo "Name: ${OUT_NAME}.dylib"
            echo
            echo "Commit:"
            echo "$GITHUB_SHA"
            echo
            echo "Branch:"
            echo "$GITHUB_REF_NAME"
            echo
            echo "Runner:"
            echo "$RUNNER_OS"
            echo
            echo "Xcode:"
            xcodebuild -version
            echo
            echo "SDK:"
            xcrun --sdk iphoneos --show-sdk-path
            echo
            echo "Architectures:"
            lipo -info "packages/${OUT_NAME}.dylib"
            echo
            echo "File:"
            file "packages/${OUT_NAME}.dylib"
          } > packages/build-info.txt

          cat packages/build-info.txt

      - name: Upload universal dylib
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-universal-${{ github.sha }}
          path: packages/*.dylib
          if-no-files-found: error
          retention-days: 30

      - name: Upload architecture slices
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-slices-${{ github.sha }}
          path: build_slices/*.dylib
          if-no-files-found: error
          retention-days: 30

      - name: Upload build info
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-build-info-${{ github.sha }}
          path: packages/build-info.txt
          if-no-files-found: error
          retention-days: 30

      - name: Package source
        if: ${{ github.event.inputs.build_source_zip != 'false' }}
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'AVX512' }}
        run: |
          set -euo pipefail

          zip -r \
            "packages/${OUT_NAME}-source.zip" \
            . \
            -x './.git/*' \
            -x './__MACOSX/*' \
            -x './packages/*' \
            -x './build_slices/*'

          ls -lh "packages/${OUT_NAME}-source.zip"

      - name: Upload source ZIP
        if: ${{ github.event.inputs.build_source_zip != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: AVX512-source-${{ github.sha }}
          path: packages/*-source.zip
          if-no-files-found: error
          retention-days: 30