name: Build MRzefv Generated Dylib
on:
  workflow_dispatch:
    inputs:
      out_name:
        description: "Output dylib name"
        required: false
        default: "MRzefvGenerated"
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    name: Build Generated Dylib
    runs-on: macos-15
    steps:
      # =========================================================
      # CHECKOUT
      # =========================================================
      - name: Checkout generated project
        uses: actions/checkout@v4
      # =========================================================
      # TOOLCHAIN
      # =========================================================
      - name: Show Apple toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "APPLE TOOLCHAIN"
          echo "========================================"
          xcodebuild -version
          echo
          echo "iPhoneOS SDK:"
          xcrun --sdk iphoneos --show-sdk-path
          echo
          echo "Clang:"
          xcrun --sdk iphoneos -f clang
      # =========================================================
      # LDID
      # =========================================================
      - name: Install ldid
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "INSTALLING LDID"
          echo "========================================"
          if command -v ldid >/dev/null 2>&1; then
            echo "ldid already installed:"
            command -v ldid
          else
            brew update
            brew install ldid
          fi
          echo
          echo "ldid:"
          command -v ldid
          ldid --version || true
      # =========================================================
      # VALIDATE GENERATED PROJECT
      # =========================================================
      - name: Validate generated project
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "VALIDATING GENERATED PROJECT"
          echo "========================================"
          echo
          echo "Repository root:"
          pwd
          echo
          echo "Required files:"
          required_files=(
            "build.sh"
            "manifest.json"
            "Sources/MRzefvGenerated.h"
            "Sources/MRzefvGenerated.m"
          )
          for file in "${required_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error::Missing required file: $file"
              echo
              echo "Repository contents:"
              find . -maxdepth 4 -type f -print | sort
              exit 1
            fi
            echo "✓ $file"
          done
          if [[ -f "Makefile" ]]; then
            echo "• Makefile present but not required"
          else
            echo "• Makefile not required"
          fi
          if [[ -d "Resources" ]]; then
            echo "✓ Resources/"
          else
            echo "• Resources/ not present"
          fi
          echo
          echo "✓ Generated project validation passed"
      # =========================================================
      # READ CANONICAL SESSION ID
      # =========================================================
      - name: Read generated session ID
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "GENERATED SESSION"
          echo "========================================"
          SESSION_ID="$(
            plutil \
              -extract build.sessionID \
              raw \
              -o - \
              manifest.json
          )"
          if [[ -z "$SESSION_ID" || "$SESSION_ID" == "null" ]]; then
            echo "::error::manifest.json does not contain build.sessionID"
            exit 1
          fi
          echo "Session ID:"
          echo "$SESSION_ID"
          echo "MRZEFV_SESSION_ID=$SESSION_ID" >> "$GITHUB_ENV"
      # =========================================================
      # VERIFY SESSION CONSISTENCY
      # =========================================================
      - name: Verify session metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "VERIFYING SESSION METADATA"
          echo "========================================"
          MANIFEST_SESSION="$(
            plutil \
              -extract build.sessionID \
              raw \
              -o - \
              manifest.json
          )"
          RECEIPT="generation-receipt.json"
          if [[ -f "$RECEIPT" ]]; then
            RECEIPT_SESSION="$(
              plutil \
                -extract sessionID \
                raw \
                -o - \
                "$RECEIPT"
            )"
            echo "Manifest session: $MANIFEST_SESSION"
            echo "Receipt session:  $RECEIPT_SESSION"
            if [[ "$MANIFEST_SESSION" != "$RECEIPT_SESSION" ]]; then
              echo "::error::Session ID mismatch between manifest.json and generation-receipt.json"
              exit 1
            fi
            echo "✓ Session IDs match"
          else
            echo "• generation-receipt.json not present"
          fi
      # =========================================================
      # BUILD ID
      # =========================================================
      - name: Set build identity
        shell: bash
        run: |
          set -euo pipefail
          BUILD_ID="MRZ-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "MRZEFV_BUILD_ID=${BUILD_ID}" >> "$GITHUB_ENV"
          echo "Build ID:"
          echo "$BUILD_ID"
      # =========================================================
      # BUILD
      # =========================================================
      - name: Build generated dylib
        shell: bash
        env:
          OUT_NAME: ${{ github.event.inputs.out_name || 'MRzefvGenerated' }}
        run: |
          set -euo pipefail
          echo "========================================"
          echo "MRzefv GENERATED BUILD"
          echo "========================================"
          echo "Target:"
          echo "${OUT_NAME}"
          echo
          echo "Session:"
          echo "${MRZEFV_SESSION_ID}"
          echo
          echo "Build:"
          echo "${MRZEFV_BUILD_ID}"
          echo
          echo "Making build.sh executable..."
          chmod +x build.sh
          echo
          echo "Running build.sh..."
          ./build.sh
      # =========================================================
      # VERIFY BUILD OUTPUT
      # =========================================================
      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          echo "========================================"
          echo "BUILD OUTPUT"
          echo "========================================"
          if [[ ! -d "packages" ]]; then
            echo "::error::packages/ directory was not produced"
            exit 1
          fi
          echo
          echo "Package directory:"
          find packages \
            -maxdepth 1 \
            -type f \
            -print \
            -exec ls -lh {} \;
          DYLIB="$(
            find packages \
              -maxdepth 1 \
              -name "*.dylib" \
              -type f \
              | head -n 1
          )"
          ZIP="$(
            find packages \
              -maxdepth 1 \
              -name "*.zip" \
              -type f \
              | head -n 1
          )"
          if [[ -z "$DYLIB" ]]; then
            echo "::error::No dylib produced"
            exit 1
          fi
          if [[ -z "$ZIP" ]]; then
            echo "::error::No ZIP package produced"
            exit 1
          fi
          echo
          echo "✓ Dylib:"
          echo "$DYLIB"
          echo
          echo "✓ ZIP:"
          echo "$ZIP"
      # =========================================================
      # VERIFY DYLIB
      # =========================================================
      - name: Verify dylib
        shell: bash
        run: |
          set -euo pipefail
          DYLIB="$(
            find packages \
              -maxdepth 1 \
              -name "*.dylib" \
              -type f \
              | head -n 1
          )"
          echo "========================================"
          echo "VERIFYING DYLIB"
          echo "========================================"
          echo
          echo "File:"
          file "$DYLIB"
          echo
          echo "Architectures:"
          lipo -info "$DYLIB"
          echo
          echo "Install name / linked libraries:"
          otool -L "$DYLIB" || true
      # =========================================================
      # VERIFY BUILD METADATA
      # =========================================================
      - name: Verify build metadata
        shell: bash
        run: |
          set -euo pipefail
          BUILD_INFO="packages/build-info.json"
          if [[ ! -f "$BUILD_INFO" ]]; then
            echo "::error::Missing packages/build-info.json"
            exit 1
          fi
          echo "========================================"
          echo "BUILD METADATA"
          echo "========================================"
          cat "$BUILD_INFO"
          BUILD_SESSION="$(
            plutil \
              -extract sessionID \
              raw \
              -o - \
              "$BUILD_INFO"
          )"
          if [[ "$BUILD_SESSION" != "$MRZEFV_SESSION_ID" ]]; then
            echo "::error::Session ID mismatch in build-info.json"
            echo "Expected: $MRZEFV_SESSION_ID"
            echo "Found:    $BUILD_SESSION"
            exit 1
          fi
          echo
          echo "✓ build-info.json session ID matches manifest.json"
      # =========================================================
      # UPLOAD DYLIB
      # =========================================================
      - name: Upload dylib
        uses: actions/upload-artifact@v4
        with:
          name: MRzefvGenerated-dylib-${{ github.run_number }}
          path: packages/*.dylib
          if-no-files-found: error
          retention-days: 30
      # =========================================================
      # UPLOAD ZIP
      # =========================================================
      - name: Upload generated ZIP
        uses: actions/upload-artifact@v4
        with:
          name: MRzefvGenerated-package-${{ github.run_number }}
          path: packages/*.zip
          if-no-files-found: error
          retention-days: 30
      # =========================================================
      # UPLOAD BUILD METADATA
      # =========================================================
      - name: Upload build metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MRzefvGenerated-metadata-${{ github.run_number }}
          path: |
            manifest.json
            generation-receipt.json
            packages/build-info.json
          if-no-files-found: ignore
          retention-days: 30
